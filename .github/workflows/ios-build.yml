name: iOS Build (unsigned)

# Produces an UNSIGNED .ipa, committed directly to dist/ by this workflow
# (see the final step -- Actions artifacts redirect through Azure Blob
# Storage hosts that can't be reliably fetched from arbitrary tooling, so
# committing straight to the repo is more robust than relying on the
# artifact download path). An unsigned .ipa will NOT install on a
# physical iPhone as-is -- iOS enforces code signing at the OS level, no
# build tooling gets around that, only an actual Apple identity does.
#
# Runs on macos-26 (Xcode 26.x, iOS 26 SDK) specifically so this compiles
# against the SDK that has real Liquid Glass APIs. Be clear-eyed about
# what that buys you, though: this app's actual UI is a WKWebView (static/
# *.html/js/css), and glassEffect()/GlassEffectContainer are SwiftUI/UIKit
# APIs that don't reach web content. Building with the iOS 26 SDK gets
# Liquid Glass automatically applied to genuine native system UI this app
# shows -- the status bar, the Face ID prompt, any share sheet -- on a
# device actually running iOS 26. It does not put Liquid Glass on the
# listing cards, filters, or anything else rendered in the WebView; that
# got a CSS approximation instead (see static/style.css).
#
# To go from this artifact to something on your phone, either:
#   (a) Download dist/TeslaFSDFinderAU-unsigned.ipa from the repo and hand
#       the .app to Sideloadly or AltStore/SideStore on your own machine --
#       they sign it with your own free Apple ID at install time (re-sign
#       every 7 days on a free ID).
#   (b) Skip CI entirely: `./scripts/build-ios.sh --open` on your Mac lets
#       Xcode sign with your Apple ID and run straight to your phone over
#       USB/WiFi -- fewer moving parts than round-tripping through CI.
#   (c) Add real Apple Developer Program signing secrets (a .p12 cert +
#       provisioning profile, or fastlane match) to this workflow, which
#       would let CI itself produce something installable via
#       TestFlight/ad-hoc -- a meaningfully bigger credential-sharing step
#       than anything else in this repo, worth doing deliberately, not by
#       default.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Confirm actual Xcode/SDK on this runner
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload dist
          cp -r "build/DerivedData/Build/Products/Release-iphoneos/App.app" build/Payload/
          cd build && zip -r TeslaFSDFinderAU-unsigned.ipa Payload
          cp TeslaFSDFinderAU-unsigned.ipa ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: TeslaFSDFinderAU-unsigned-ipa
          path: build/TeslaFSDFinderAU-unsigned.ipa
          retention-days: 14

      - name: Commit IPA back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/TeslaFSDFinderAU-unsigned.ipa
          if git diff --staged --quiet; then
            echo "No change in IPA contents, nothing to commit"
          else
            git commit -m "chore: update unsigned iOS build artifact [skip ci]

          Built from $(git rev-parse --short HEAD) by this workflow run.
          Unsigned -- sideload with your own Apple ID via Sideloadly/AltStore
          to actually install it."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
