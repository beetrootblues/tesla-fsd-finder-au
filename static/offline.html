<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Tesla FSD Finder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .offline-container { max-width: 400px; }
    .offline-icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .retry-btn {
      display: inline-block;
      padding: 14px 40px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .retry-btn:hover { background: #2563eb; }
    .retry-btn:active { transform: scale(0.97); }
    .watchlist-hint {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">&#9889;</div>
    <h1>You're Offline</h1>
    <p>
      Tesla FSD Finder needs an internet connection to fetch the latest listings.
      Check your connection and try again.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    <div class="watchlist-hint">
      Your watchlist is saved locally and will be available when you reconnect.
    </div>
  </div>
</body>
</html>
